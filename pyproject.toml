[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confluence-scrapper-rag"
version = "0.1.0"
description = "CLI to ingest Confluence pages into a vector store and answer questions (RAG)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
authors = [{ name = "Your Name" }]
dependencies = [
  "beautifulsoup4>=4.12.3",
  "chromadb>=0.5.0",
  "httpx>=0.27.0",
  "lxml>=5.2.2",
  "python-dotenv>=1.0.1",
  "rich>=13.8.1",
  "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.6.0",
]

[project.scripts]
confluence-rag = "confluence_rag.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

